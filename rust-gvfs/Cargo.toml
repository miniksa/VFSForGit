[workspace]
resolver = "2"
members = [
    "crates/projfs",
    "crates/gvfs-common",
    "crates/gvfs-virtualization",
    "crates/gvfs-cli",
    "crates/gvfs-mount",
    "crates/gvfs-service",
    "crates/gvfs-hooks",
    "crates/gvfs-native-hooks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Shared across crates
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha1 = "0.10"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
widestring = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"
hex = "0.4"
byteorder = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_Services",
    "Win32_System_Console",
]

[workspace.dependencies.windows-core]
version = "0.58"

# Internal workspace crate references
[workspace.dependencies.projfs]
path = "crates/projfs"

[workspace.dependencies.gvfs-common]
path = "crates/gvfs-common"

[workspace.dependencies.gvfs-virtualization]
path = "crates/gvfs-virtualization"
